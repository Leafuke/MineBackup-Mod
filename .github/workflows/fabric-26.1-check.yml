name: Fabric 26.1 check

on:
  push:
    paths:
      - "Fabric/Fabric-26.1/**"
      - ".github/workflows/fabric-26.1-check.yml"
  pull_request:
    paths:
      - "Fabric/Fabric-26.1/**"
      - ".github/workflows/fabric-26.1-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Fabric/Fabric-26.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean build --warning-mode all
