name: MineBackup reliability checks

on:
  push:
    paths:
      - "Fabric/Fabric-1.21/**"
      - "Fabric/Fabric-1.21.11/**"
      - "Fabric/Fabric-26.1/**"
      - "Fabric/Fabric-26.2/**"
      - "Fabric/Fabric-26.3/**"
      - "Neoforge/NeoForge-1.21/**"
      - "Neoforge/NeoForge-26.1/**"
      - "Forge/Forge-1.20/**"
      - "tests/**"
      - ".github/workflows/fabric-26.1-check.yml"
      - ".github/workflows/release-maintained-builds.yml"
      - "scripts/check_join_notification_parity.py"
      - "Fabric/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Neoforge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Forge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Fabric/**/src/main/resources/assets/minebackup/lang/**"
      - "Neoforge/**/src/main/resources/assets/minebackup/lang/**"
      - "Forge/**/src/main/resources/assets/minebackup/lang/**"
  pull_request:
    paths:
      - "Fabric/Fabric-1.21/**"
      - "Fabric/Fabric-1.21.11/**"
      - "Fabric/Fabric-26.1/**"
      - "Fabric/Fabric-26.2/**"
      - "Fabric/Fabric-26.3/**"
      - "Neoforge/NeoForge-1.21/**"
      - "Neoforge/NeoForge-26.1/**"
      - "Forge/Forge-1.20/**"
      - "tests/**"
      - ".github/workflows/fabric-26.1-check.yml"
      - ".github/workflows/release-maintained-builds.yml"
      - "scripts/check_join_notification_parity.py"
      - "Fabric/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Neoforge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Forge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Fabric/**/src/main/resources/assets/minebackup/lang/**"
      - "Neoforge/**/src/main/resources/assets/minebackup/lang/**"
      - "Forge/**/src/main/resources/assets/minebackup/lang/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Fabric/Fabric-1.21
            java: "21"
          - project: Fabric/Fabric-1.21.11
            java: "21"
          - project: Fabric/Fabric-26.1
            java: "25"
          - project: Fabric/Fabric-26.2
            java: "25"
          - project: Fabric/Fabric-26.3
            java: "25"
          - project: Neoforge/NeoForge-1.21
            java: "21"
          - project: Neoforge/NeoForge-26.1
            java: "25"
          - project: Forge/Forge-1.20
            java: "17"
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean build --warning-mode all

      - name: Check maintained join notification parity
        run: python3 ../../scripts/check_join_notification_parity.py
