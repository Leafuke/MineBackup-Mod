name: Fabric 26.1 check

on:
  push:
    paths:
      - "Fabric/Fabric-26.1/**"
      - ".github/workflows/fabric-26.1-check.yml"
      - ".github/workflows/release-maintained-builds.yml"
      - "scripts/check_join_notification_parity.py"
      - "Fabric/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Neoforge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Forge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Fabric/**/src/main/resources/assets/minebackup/lang/**"
      - "Neoforge/**/src/main/resources/assets/minebackup/lang/**"
      - "Forge/**/src/main/resources/assets/minebackup/lang/**"
  pull_request:
    paths:
      - "Fabric/Fabric-26.1/**"
      - ".github/workflows/fabric-26.1-check.yml"
      - ".github/workflows/release-maintained-builds.yml"
      - "scripts/check_join_notification_parity.py"
      - "Fabric/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Neoforge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Forge/**/src/main/java/com/leafuke/minebackup/config/Config.java"
      - "Fabric/**/src/main/resources/assets/minebackup/lang/**"
      - "Neoforge/**/src/main/resources/assets/minebackup/lang/**"
      - "Forge/**/src/main/resources/assets/minebackup/lang/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Fabric/Fabric-26.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean build --warning-mode all

      - name: Check maintained join notification parity
        run: python3 ../../scripts/check_join_notification_parity.py
